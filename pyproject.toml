[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-quality-evaluator"
version = "1.0.0"
description = "Pipeline multiagente com LangGraph para avaliar qualidade de atendimento em conversas chatbot-lead."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.67.0",
    "fastapi>=0.111",
    "langchain>=0.3.0",
    "langchain-aws>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langsmith>=0.1.0",
    "openai>=1.0.0",
    "pydantic>=2.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
